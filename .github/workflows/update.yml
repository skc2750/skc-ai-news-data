          expected = '76913800be3e9d266c22bfecedafb35b81fce4755ab5f1df40e028f453d58f65'
          exact = set(["lib/projects.cjs","lib/showcases.cjs","lib/core.cjs","lib/collect.cjs","lib/store.cjs","scripts/prepare.cjs","scripts/update.cjs","scripts/verify.cjs","test/projects.test.cjs","test/pipeline.test.cjs","test/showcases.test.cjs","README.md","data/projects.json","data/showcases.json"])
