name: Publish AI studio catalogue

on:
  push:
    paths:
      - .github/workflows/update.yml
      - 'lib/**'
      - 'scripts/**'
      - 'test/**'
      - package.json
      - package-lock.json
  schedule:
    # Asia/Kuala_Lumpur 09:00 = UTC 01:00. Free scheduling can be delayed.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-ai-studio-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Read public model prices, projects, creators and AI era
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run collect
      - run: npm run verify
      - name: Commit one verified catalogue generation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/catalog.json data/receipt.json data/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update verified AI studio catalogue'
          ASKPASS="$RUNNER_TEMP/ai-studio-askpass.sh"
          cat > "$ASKPASS" <<'ASKPASS_SCRIPT'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
          esac
          ASKPASS_SCRIPT
          chmod 700 "$ASKPASS"
          trap 'rm -f -- "$ASKPASS"' EXIT
          GIT_ASKPASS="$ASKPASS" git push origin "HEAD:${GITHUB_REF_NAME}"
